services:
  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg2://cartshield:cartshield@postgres:5432/cartshield
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=checkout,dead_letter"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://cartshield:cartshield@postgres:5432/cartshield
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=cartshield
      - POSTGRES_PASSWORD=cartshield
      - POSTGRES_DB=cartshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
